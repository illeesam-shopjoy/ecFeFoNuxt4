# GitHub push → 텔레그램 알림
# 각 저장소의 .github/workflows/telegram-push-notify.yml 로 배치한다.
# 필요한 Secrets: TELEGRAM_BOT_TOKEN_DEV, TELEGRAM_CHAT_ID_DEV (shopjoy-dev 그룹)
#   + 운영 사이트 저장소(ecFeBo·ecFeFoNuxt4·ecFeMain)는 TELEGRAM_BOT_TOKEN_OPER, TELEGRAM_CHAT_ID_OPER (shopjoy-oper 그룹, 없으면 건너뜀)
name: telegram-push-notify

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 수동 실행(알림 테스트용)

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 텔레그램 발송 (개발 그룹)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_DEV }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID_DEV }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMITS: ${{ github.event.head_commit.message }}
          COMPARE: ${{ github.event.compare }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "텔레그램 시크릿 없음 - 스킵"; exit 0; }
          TITLE=$(printf '%s' "$COMMITS" | head -n 1 | cut -c1-200)
          curl -s -m 15 -o /dev/null -w "telegram http %{http_code}\n" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=📦 [GitHub push] $REPO (main)
          작성자: $ACTOR
          커밋: $TITLE
          $COMPARE"
      - name: 텔레그램 발송 (운영 그룹)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_OPER }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID_OPER }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMITS: ${{ github.event.head_commit.message }}
          COMPARE: ${{ github.event.compare }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "운영 텔레그램 시크릿 없음 - 스킵"; exit 0; }
          TITLE=$(printf '%s' "$COMMITS" | head -n 1 | cut -c1-200)
          curl -s -m 15 -o /dev/null -w "telegram(oper) http %{http_code}\n" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=📦 [GitHub push · 운영 사이트 저장소] $REPO (main)
          작성자: $ACTOR
          커밋: $TITLE
          $COMPARE"
