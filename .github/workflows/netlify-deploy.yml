name: Deploy to Netlify

# Netlify의 네이티브 "Link a different repository" 기능(GitHub App 기반 CD)이
# API/CLI 토큰으로는 재설정되지 않아(2026-09-09 확인), 대신 GitHub Actions에서
# 직접 빌드하고 Netlify CLI로 배포하는 방식으로 CD를 구성한다.
# 필요한 저장소 시크릿: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
# 배포결과 이메일 통지(선택, 2026-09-10 추가): NOTIFY_EMAIL_TO, NOTIFY_EMAIL_FROM,
# NOTIFY_EMAIL_APP_PASSWORD(Gmail 앱 비밀번호) — 없으면 조용히 스킵됨.
# 2026-09-10: DATABASE_URL 시크릿은 더 이상 안 씀(BFF 전환으로 Prisma 제거, server/utils/beApi.ts 참조).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 2026-09-12: 이후 3단계(Install/Build/Deploy) 출력을 deploy.log 로도 남겨서 Notify 단계가
      # 메일에 실제 로그파일을 첨부할 수 있게 한다 — `tee -a`로 콘솔(Actions 로그)에는 그대로 보이면서
      # 파일에도 누적. set -o pipefail 필수: 없으면 `cmd | tee` 파이프의 종료코드가 tee 것으로 덮여
      # cmd가 실패해도 스텝이 성공 처리된다.
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee -a deploy.log

      - name: Build
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee -a deploy.log
        env:
          NETLIFY: "true"
          NITRO_PRESET: netlify

      - name: Deploy to Netlify
        run: |
          set -o pipefail
          npx netlify-cli deploy --prod --dir=dist --functions=.netlify/functions-internal --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN 2>&1 | tee -a deploy.log
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Notify deploy result (email)
        if: always()
        run: |
          npm install nodemailer --no-save --prefix .github/scripts
          node .github/scripts/notify-deploy-result.mjs
        env:
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_LOG_FILE: deploy.log
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_APP_PASSWORD: ${{ secrets.NOTIFY_EMAIL_APP_PASSWORD }}
