name: Deploy to Netlify

# Netlify의 네이티브 "Link a different repository" 기능(GitHub App 기반 CD)이
# API/CLI 토큰으로는 재설정되지 않아(2026-09-09 확인), 대신 GitHub Actions에서
# 직접 빌드하고 Netlify CLI로 배포하는 방식으로 CD를 구성한다.
# 필요한 저장소 시크릿: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
# 배포결과 이메일 통지(선택, 2026-09-10 추가): NOTIFY_EMAIL_TO, NOTIFY_EMAIL_FROM,
# NOTIFY_EMAIL_APP_PASSWORD(Gmail 앱 비밀번호) — 없으면 조용히 스킵됨.
# 2026-09-10: DATABASE_URL 시크릿은 더 이상 안 씀(BFF 전환으로 Prisma 제거, server/utils/beApi.ts 참조).
# 2026-09-15(요청사항: "토스관련키야 전체적으로 이 정보 업데이타 잘 됐는지 체크해주고 안되었으면
# 수정해줘") — 이 워크플로가 순수 `nuxt build`만 실행해서(.env.production은 .gitignore 처리돼
# 러너에 없음, nuxt.config.ts의 "Netlify는 .env.production 미로드" 주석 참조) Build 단계에
# 토스 키를 넘겨주지 않고 있었다 — 즉 실제 배포된 운영 사이트는 토스 클라이언트/시크릿 키가 항상
# 빈 문자열이라 결제 자체가 동작하지 않았던 상태. NUXT_PUBLIC_TOSSPAYMENTS_CLIENT_KEY/
# TOSSPAYMENTS_SECRET_KEY 시크릿을 추가하고 Build 단계에 주입해서 바로잡음(현재 값은
# .env.production과 동일한 토스 문서예제 테스트 키 — 실 결제 없음).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 2026-09-12: 이후 3단계(Install/Build/Deploy) 출력을 deploy.log 로도 남겨서 Notify 단계가
      # 메일에 실제 로그파일을 첨부할 수 있게 한다 — `tee -a`로 콘솔(Actions 로그)에는 그대로 보이면서
      # 파일에도 누적. set -o pipefail 필수: 없으면 `cmd | tee` 파이프의 종료코드가 tee 것으로 덮여
      # cmd가 실패해도 스텝이 성공 처리된다.
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee -a deploy.log

      - name: Build
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee -a deploy.log
        env:
          NETLIFY: "true"
          NITRO_PRESET: netlify
          NUXT_PUBLIC_TOSSPAYMENTS_CLIENT_KEY: ${{ secrets.NUXT_PUBLIC_TOSSPAYMENTS_CLIENT_KEY }}
          TOSSPAYMENTS_SECRET_KEY: ${{ secrets.TOSSPAYMENTS_SECRET_KEY }}
          # 토스 결제창(주문 화면 결제수단 선택) 승인용 시크릿(2026-09-25)
          TOSSPAYMENTS_PAY_SECRET_KEY: ${{ secrets.TOSSPAYMENTS_PAY_SECRET_KEY }}
          # 결제 결과를 ecBeBo 에 기록할 때 쓰는 서버 간 공유 키(백엔드 app.pay.sync-key 와 동일)
          PAY_SYNC_KEY: ${{ secrets.PAY_SYNC_KEY }}
          # 구글 로그인 웹 클라이언트 시크릿(2026-09-25) — 저장소 파일이 아니라 Actions 시크릿으로만 보관
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # 네이버 로그인 클라이언트 시크릿(2026-09-25, 앱 illeesam_netlify)
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Deploy to Netlify
        run: |
          set -o pipefail
          npx netlify-cli deploy --prod --dir=dist --functions=.netlify/functions-internal --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN 2>&1 | tee -a deploy.log
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Notify deploy result (email)
        if: always()
        run: |
          npm install nodemailer --no-save --prefix .github/scripts
          node .github/scripts/notify-deploy-result.mjs
        env:
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_LOG_FILE: deploy.log
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_APP_PASSWORD: ${{ secrets.NOTIFY_EMAIL_APP_PASSWORD }}
