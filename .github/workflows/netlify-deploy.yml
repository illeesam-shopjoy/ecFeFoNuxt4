name: Deploy to Netlify

# Netlify의 네이티브 "Link a different repository" 기능(GitHub App 기반 CD)이
# API/CLI 토큰으로는 재설정되지 않아(2026-09-09 확인), 대신 GitHub Actions에서
# 직접 빌드하고 Netlify CLI로 배포하는 방식으로 CD를 구성한다.
# 필요한 저장소 시크릿: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
# 배포결과 이메일 통지(선택, 2026-09-10 추가): NOTIFY_EMAIL_TO, NOTIFY_EMAIL_FROM,
# NOTIFY_EMAIL_APP_PASSWORD(Gmail 앱 비밀번호) — 없으면 조용히 스킵됨.
# 2026-09-10: DATABASE_URL 시크릿은 더 이상 안 씀(BFF 전환으로 Prisma 제거, server/utils/beApi.ts 참조).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NETLIFY: "true"
          NITRO_PRESET: netlify

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=dist --functions=.netlify/functions-internal --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Notify deploy result (email)
        if: always()
        run: |
          npm install --no-save nodemailer
          node .github/scripts/notify-deploy-result.mjs
        env:
          DEPLOY_STATUS: ${{ job.status }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_APP_PASSWORD: ${{ secrets.NOTIFY_EMAIL_APP_PASSWORD }}
